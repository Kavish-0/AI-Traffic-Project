# Public traffic footage for development, until our own camera footage exists.
# Download with:   python -m traffic_intel.datasets download <name>     (or --all)
# Files go to `file` (relative to the project root; data/ is git-ignored) and an
# attribution entry is appended to data/external/SOURCES.md.
#
# Licensing: check `license` before publishing any frame, clip or result video.

videos:
  roboflow_vehicles:
    url: https://media.roboflow.com/supervision/video-examples/vehicles.mp4
    file: data/raw/public/roboflow_vehicles.mp4
    source: "Roboflow `supervision` example assets (media.roboflow.com)"
    license: "Not stated by the publisher - local development/research only; do not redistribute"
    description: "Multi-lane highway seen from an elevated camera; dense car/truck traffic in both directions"
    sha256: ac81100d9310bd4e9c02bc0b13b6492781d009742ced347766b2601be3c44ad4

  intel_car_detection:
