# Pipeline composition: which implementation backs each interface.
# Every `type` is a name in that interface's Registry; `params` go to its constructor.
# Swapping a model = changing `type` here (see backend/traffic_intel/core/registry.py).

network_file: network/demo_network.yaml
camera_files:
  - cameras/public_highway.yaml  # development: public motorway footage (python -m traffic_intel.datasets download roboflow_vehicles)
  - cameras/cam_01.yaml          # placeholder for your own camera

# Offline artefacts written by each camera worker (paths relative to the project root).
# Frame-level data stays here; only 1 s live values and 60 s windows are published on the bus.
outputs:
  runs_dir: runs                 # runs/<camera>/<run_id>/{traffic_states.jsonl, tracks.jsonl, annotated.mp4, summary.json}
  parquet_dir: data/interim      # data/interim/<camera>/<date>/<run_id>/{detections,tracks,track_summaries}-NNNNN.parquet
  record_detections: true
  record_tracks: true
  record_track_summaries: true
  parquet_flush_rows: 50000
  annotate_video: false          # or pass --annotate
  video_codec: mp4v

# Applied in order after decode/resize (resize + fps sampling are per camera: cameras/*.yaml).
# Available: roi_mask {padding_px}, clahe {clip_limit, tile, only_if_mean_below},
#            undistort {camera_matrix, dist_coeffs, image_size}
preprocessors:
  - type: roi_mask               # black out everything outside the (dilated) ROI before detection
    params: {padding_px: 40}

detector:
  type: yolo                     # also: precomputed {path: detections.csv} | synthetic {scenario}
  params:
    weights: models/detection/yolo11m.pt    # any Ultralytics .pt/.onnx/.engine; downloaded if missing
    auto_download: true
    conf_threshold: 0.25
    iou_threshold: 0.5
    imgsz: 1280                  # inference size; 1280 keeps distant vehicles detectable (use 640 on CPU)
    device: auto                 # auto = CUDA if available, else MPS, else CPU | cuda | cuda:N | mps | cpu
    fallback_to_cpu: true        # requested GPU missing -> CPU with a warning (false -> fail)
    half: auto                   # fp16 on CUDA only (auto) | true | false
    max_det: 300
    class_map:                   # model label (or integer model class id) -> ObjectClass; others dropped
      car: car
      motorcycle: motorcycle
      bus: bus
      truck: truck
      bicycle: bicycle
      person: pedestrian
    class_confidence:            # optional per-class minimum confidence
      pedestrian: 0.35
      bicycle: 0.3

tracker:
  type: bytetrack                # or: botsort (ByteTrack + optical-flow camera-motion compensation)
  params:
    track_high_thresh: 0.5       # detections above: first association round
    track_low_thresh: 0.1        # between low and high: second ("BYTE") round only
    new_track_thresh: 0.4        # min confidence to start a track (0.6 -> 0.4: tuned on UA-DETRAC validation; test MOTA 0.737 -> 0.749, docs/MODEL_EVALUATION.md)
    track_buffer_s: 3.0          # keep lost tracks this long (converted to frames with the camera fps)
    match_thresh: 0.8            # max (1 - IoU*score) cost in round 1
    min_hits: 2                  # matches before a new track is output
    output_box: detection        # detection (raw) | kalman (smoothed); speeds are smoothed downstream

ground_projector:
  type: homography
  params:
    region_margin: 0.15          # projections trusted up to 15% outside the calibration points' hull
    max_reprojection_error_m: 1.0

feature_engine:
  type: default
  params:
    window_s: 60                 # persisted/ML resolution (must equal feature_schema.BASE_RESOLUTION_S)
    live_window_s: 5             # rolling window of the live state
    live_tick_s: 1.0             # how often a live state is produced
    trajectory:
      history_s: 10              # per-track history kept for kinematics
      max_age_s: 3.5             # unseen this long -> trajectory finished (>= tracker buffer)
      speed_window_s: 1.0        # least-squares velocity window
      speed_min_span_s: 0.5
      speed_min_track_s: 0.8     # no speed from tracks younger than this
      speed_ema_alpha: 0.5
      max_speed_kmh: 160         # faster = measurement error, ignored
      stopped_speed_kmh: 5.0
    stopped_min_s: 2.0           # stopped vehicle = below stopped_speed_kmh for >= this
    queue_speed_kmh: 7.0         # queued vehicle = slower than this, inside the queue zone
    queue_head_max_m: 15.0       # queue must start within this distance of the stop line
    queue_max_gap_m: 15.0        # queue continues while bumper gaps are <= this
    jam_density_veh_km_lane: 150 # density_ratio denominator (PCU-weighted)
    use_pcu: true
    min_track_points: 3          # frames in ROI before a track is counted
    edge_margin_px: 4            # boxes touching the frame edge give no speed
    # calculators: [counts, speed, density, occupancy, flow, stopped, queue, gaps, trajectories]

congestion_classifier:
  type: rule_based               # learned classifiers (random_forest | xgboost) are future work (Phase 7)
  params:
    rules_file: congestion_rules.yaml

# Forecasting is served from the model registry (models/forecasting/<model>/<version>/) by
# traffic_intel.forecasting.service.ForecastingService. The model is NAMED here (not `auto`): only a model
# trained on the live feature set / 1-min resolution may serve the pipeline; the METR-LA / PEMS-BAY / PEMS08
# benchmark models stay CANDIDATE. Selection evidence: docs/MODEL_EVALUATION.md (forecasting).
#   python -m traffic_intel.ai.training train forecasting --config ../configs/training/forecasting.yaml
#   python -m traffic_intel.ai.training promote forecasting xgboost_d8 <experiment id>
forecaster:
  type: registry
  params:
    model: xgboost_d8            # best VALIDATION RMSE on the live feature set (experiment 20260925-024730)
    version: production          # production | latest | <experiment id>

# Incident intelligence (docs/INCIDENT_INTELLIGENCE.md). Track detectors run in the camera worker on
# every processed frame; series detectors run once per closed 60 s window per approach.
# Road/lane directions are NOT set here: they come from each camera's lane zones (`direction`).
track_anomaly_detectors:
  - type: stopped_vehicle
    params: {min_stopped_s: 30, max_speed_kmh: 3, exclude_queue_zone: true, max_queue_wait_s: 180}
  - type: wrong_way
    params: {min_distance_m: 8, cos_threshold: -0.5, min_speed_kmh: 5}
  - type: trajectory_rules
    params: {min_speed_kmh: 15, max_heading_rate_deg_s: 30, off_lane_s: 2}

series_anomaly_detectors:
  - type: sudden_slowdown        # speed vs EWMA baseline (drop + z-score)
    params: {drop_min: 0.25, drop_full: 0.6, z_full: 3.0}
  - type: queue_growth           # queue slope + rise above recent median
    params: {trend_windows: 4, rate_full_m_per_window: 8.0}
  - type: density_zscore         # robust (median/MAD) z-score of density
    params: {z_min: 3.0, z_full: 6.0}
  - type: flow_imbalance         # inflow >> outflow (vehicles accumulating)
    params: {windows: 3}
  - type: ewma                   # EWMA control chart, several features
    params: {lam: 0.3, L: 3.0}
  - type: zscore                 # moving average + rolling std z-score
    params: {L: 3.0}
  # Learned detectors (train: python -m traffic_intel.ai.training train anomaly --config configs/training/anomaly.yaml)
  # Off and retired: at chance level on the synthetic evaluation (docs/MODEL_EVALUATION.md §3). To try one,
  # promote a version first: python -m traffic_intel.ai.training promote anomaly <name> <version>
  # - type: isolation_forest
  #   params: {version: production}
  # - type: autoencoder
  #   params: {version: production}

incident_fuser:
  type: weighted_logistic
  params:
    config_file: anomaly.yaml

risk_engine:
  type: weighted
  params:
    config_file: risk.yaml

simulator:
  type: static_assignment
  params: {bpr_alpha: 0.15, bpr_beta: 4, msa_iterations: 50, k_paths: 3}

weather_provider:
  type: open_meteo
  params: {cache_ttl_s: 900}

calendar_provider:
  type: holidays
  params: {country: IN, overrides_file: null}
