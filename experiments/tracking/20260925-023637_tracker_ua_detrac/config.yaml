name: tracker_ua_detrac
description: ByteTrack vs BoT-SORT on held-out UA-DETRAC sequences with the production
  detector.
dataset: ua_detrac
detector_weights: models/detection/yolo11m.pt
detector_imgsz: 960
detector_conf: 0.1
val_split_file: data/processed/ua_detrac_yolo/split.json
test_sequences: 20
cache_dir: data/interim/ua_detrac_detections
trackers:
- type: bytetrack
  grid:
    track_high_thresh:
    - 0.4
    - 0.5
    - 0.6
    match_thresh:
    - 0.7
    - 0.8
    new_track_thresh:
    - 0.4
    - 0.6
- type: botsort
  grid:
    track_high_thresh:
    - 0.5
    - 0.6
    new_track_thresh:
    - 0.4
    - 0.6
